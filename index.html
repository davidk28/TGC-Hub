        return `
          <button onclick="selectAgency('${code}')"
            class="px-3.5 py-2 rounded-lg text-sm font-medium transition cursor-pointer flex items-center gap-2 ${
              active ? "bg-slate-900 text-white shadow-sm" : "bg-white text-slate-700 border border-slate-200 hover:bg-slate-100"
            }">
            <span>${agencyMeta[code].label}</span>
            <span class="text-xs px-1.5 py-0.5 rounded-full ${active ? "bg-slate-700 text-sky-300" : "bg-slate-100 text-slate-600"}">${count}</span>
          </button>
        `;
      }).join("");
    }

    function renderCategories() {
      const container = document.getElementById("category-filters");
      container.innerHTML = categories.map(cat => {
        const active = selectedCategory === cat;
        return `
          <button onclick="selectCategory('${cat}')"
            class="px-3 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ${
              active ? "bg-sky-600 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
            }">
            ${cat}
          </button>
        `;
      }).join("");
    }

    function selectAgency(code) {
      selectedAgency = code;
      renderTabs();
      renderList();
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderList();
    }

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem("cyber_reg_favs", JSON.stringify(favorites));
      renderList();
    }

    function highlightText(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return text.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
    }

    function renderList() {
      const query = document.getElementById("search-input").value.trim();
      const onlyRecent = document.getElementById("filter-recent").checked;
      const onlyFav = document.getElementById("filter-fav").checked;

      document.getElementById("stat-total").textContent = regulationsData.length;
      document.getElementById("stat-recent").textContent = regulationsData.filter(d => d.is_recent).length;
      document.getElementById("fav-count").textContent = favorites.length;

      const filtered = regulationsData.filter(item => {
        if (selectedAgency !== "ALL" && item.agency_code !== selectedAgency) return false;
        if (selectedCategory !== "全部類型" && item.category !== selectedCategory) return false;
        if (onlyRecent && !item.is_recent) return false;
        if (onlyFav && !favorites.includes(item.id)) return false;
        if (query) {
          const q = query.toLowerCase();
          const inTitle = item.title.toLowerCase().includes(q);
          const inSummary = item.summary.toLowerCase().includes(q);
          const inAgency = item.agency.toLowerCase().includes(q);
          const inTags = (item.domain_tags || []).some(t => t.toLowerCase().includes(q));
          const inHighlights = (item.highlights || []).some(h => h.toLowerCase().includes(q));
          return inTitle || inSummary || inAgency || inTags || inHighlights;
        }
        return true;
      });

      const listEl = document.getElementById("regulation-list");
      const emptyEl = document.getElementById("empty-state");

      if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyEl.classList.remove("hidden");
        return;
      }

      emptyEl.classList.add("hidden");
      listEl.innerHTML = filtered.map(item => {
        const meta = agencyMeta[item.agency_code] || { badge: "bg-slate-100 text-slate-700" };
        const isFav = favorites.includes(item.id);
        const domainBadges = (item.domain_tags || []).map(tag =>
          `<span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-800 text-slate-100">${tag}</span>`
        ).join("");

        return `
          <article class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
            <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
              <div class="space-y-2 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${meta.badge}">${item.agency}</span>
                  <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200">${item.category}</span>
                  ${domainBadges}
                  ${item.is_recent ? `<span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">NEW 近期更新</span>` : ""}
                  <span class="text-xs text-slate-400">發布：${item.publish_date} ｜ 更新：${item.updated_date}</span>
                </div>
                <h2 class="text-lg font-bold text-slate-900">
                  <a href="${item.source_url}" target="_blank" rel="noopener noreferrer" class="hover:text-sky-600 transition">
                    ${highlightText(item.title, query)}
                  </a>
                </h2>
                <p class="text-sm text-slate-600 leading-relaxed">${highlightText(item.summary, query)}</p>
              </div>
              <div class="flex sm:flex-row md:flex-col items-stretch sm:items-center md:items-end gap-2 shrink-0">
                <button onclick="openModal('${item.id}')" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 cursor-pointer">
                  重點摘要與實務提示
                </button>
                <div class="flex items-center gap-2">
                  <a href="${item.source_url}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50">
                    原文連結 ↗
                  </a>
                  <button onclick="toggleFavorite('${item.id}')" title="收藏此法規"
                    class="px-2.5 py-1.5 text-xs rounded-lg border cursor-pointer ${isFav ? "bg-amber-50 border-amber-300 text-amber-600" : "border-slate-200 text-slate-400 hover:text-amber-500"}">
                    ${isFav ? "★ 已收藏" : "☆ 收藏"}
                  </button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal(id) {
      const item = regulationsData.find(d => d.id === id);
      if (!item) return;
      const meta = agencyMeta[item.agency_code] || { badge: "bg-slate-100 text-slate-700" };
      const badgeEl = document.getElementById("modal-badge");
      badgeEl.className = "inline-block text-xs font-semibold px-2.5 py-0.5 rounded-full mb-2 " + meta.badge;
      badgeEl.textContent = item.agency;

      document.getElementById("modal-title").textContent = item.title;
      document.getElementById("modal-pub").textContent = item.publish_date;
      document.getElementById("modal-upd").textContent = item.updated_date;
      document.getElementById("modal-cat").textContent = item.category;
      document.getElementById("modal-summary").textContent = item.summary;
      document.getElementById("modal-link").href = item.source_url;

      const hlBox = document.getElementById("modal-highlights-box");
      const hlList = document.getElementById("modal-highlights");
      if (item.highlights && item.highlights.length > 0) {
        hlList.innerHTML = item.highlights.map(h => `<li>${h}</li>`).join("");
        hlBox.classList.remove("hidden");
      } else {
        hlBox.classList.add("hidden");
      }

      document.getElementById("detail-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.add("hidden");
    }

    function resetFilters() {
      selectedAgency = "ALL";
      selectedCategory = "全部類型";
      document.getElementById("search-input").value = "";
      document.getElementById("filter-recent").checked = false;
      document.getElementById("filter-fav").checked = false;
      renderTabs();
      renderCategories();
      renderList();
    }

    function simulateSync() {
      const toast = document.getElementById("toast");
      toast.textContent = "已完成同步檢查：目前已載入最新 IT、OT/工控/IoT、金管會、個資法及各部會資安指引資料。";
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 4500);
    }

    initData();
  </script>
</body>
</html>
